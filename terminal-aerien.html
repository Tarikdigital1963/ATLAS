<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#071426">

<title>ATLAS MONDE | Terminal aérien</title>
<style>
:root{--bg:#071426;--panel:#0d2038;--panel2:#102944;--blue:#36a9ff;--text:#f4f8ff;--muted:#bfd0e2;--line:#294866}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#173b62 0,#071426 55%);color:var(--text);font:16px/1.55 Arial,Helvetica,sans-serif}a{color:#8bd1ff}.wrap{width:min(1180px,94%);margin:auto}
header{padding:22px 0;border-bottom:1px solid #294866}.brand{text-align:center}.brand h1{font-size:clamp(2rem,6vw,4rem);line-height:1.1;margin:0;color:#48b5ff}.brand p{color:var(--muted);margin:8px 0 0;font-size:1.05rem}
main{padding:25px 0 50px}.intro{text-align:center;max-width:900px;margin:0 auto 24px}.intro h2{font-size:clamp(1.5rem,4vw,2.3rem);margin:0 0 8px}.intro p{color:var(--muted);margin:0}
.panel{background:linear-gradient(135deg,#0d2946,#0a1b30);border:1px solid #315879;border-radius:18px;padding:clamp(15px,3vw,25px);margin:18px 0;box-shadow:0 14px 38px #0005}
.notice{padding:14px 16px;border-left:4px solid #36a9ff;background:#102944;border-radius:10px;color:#e2f2ff;margin:16px 0}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:end}.field{display:flex;flex-direction:column;gap:6px;flex:1;min-width:220px}.field label{font-weight:800;color:#dcecff}select,input{width:100%;min-height:48px;border-radius:10px;border:1px solid #55728e;background:#061326;color:#fff;padding:11px 13px;font-size:1.05rem}
button{min-height:48px;border-radius:10px;border:1px solid #69c8ff;background:#087fca;color:#fff;padding:11px 17px;font-size:1rem;font-weight:800;cursor:pointer}
.airport-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin-top:18px}
.airport{background:#06182c;border:1px solid #294866;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px}
.airport h3{margin:0;font-size:1.12rem}.airport .codes{color:#9edcff;font-weight:800;letter-spacing:.04em}.airport p{margin:0;color:var(--muted);font-size:.95rem}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:5px}.actions a{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;border-radius:9px;padding:10px 12px;font-weight:800;border:1px solid #69c8ff;background:#087fca;color:white;min-height:44px}.actions a.secondary{background:#102944;border-color:#55728e;color:#dff1ff}
.empty{display:none;padding:18px;color:var(--muted);text-align:center}
footer{text-align:center;padding:22px;color:#b5c7d9;border-top:1px solid #294866}footer a{color:#8bd1ff}
@media(max-width:650px){.airport-grid{grid-template-columns:1fr}.field{min-width:100%}.toolbar button{width:100%}.airport{padding:15px}.actions a{flex:1}}

/* Grand tableau d'aéroport : affichage lumineux inspiré des halls internationaux */
.board-shell{background:#030b15;border:2px solid #42617d;border-radius:16px;overflow:hidden;box-shadow:inset 0 0 30px #000,0 12px 34px #0007;margin-top:18px}
.board-head{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;padding:15px 18px;background:linear-gradient(90deg,#102944,#071426);border-bottom:1px solid #45617c}
.board-head h2{margin:0;color:#fff;font-size:clamp(1.15rem,3vw,1.65rem);letter-spacing:.04em}
.board-clock{font-variant-numeric:tabular-nums;color:#ffd45b;font-weight:900;font-size:1.25rem}
.board-tabs{display:flex;gap:8px;flex-wrap:wrap;padding:12px 14px;background:#091728;border-bottom:1px solid #294866}
.board-tabs a,.board-tabs button{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;min-height:42px;padding:9px 14px;border-radius:8px;background:#132d47;color:#eaf5ff;border:1px solid #45617c;font-weight:900}
.board-tabs a.active,.board-tabs button.active{background:#ffd34d;color:#111;border-color:#ffe58a}
.board-info{display:flex;gap:10px;flex-wrap:wrap;padding:12px 15px;color:#c9d9e9;font-size:.92rem}
.board-info strong{color:#ffd45b}
.board-table-wrap{overflow-x:auto}
.board-table{width:100%;border-collapse:collapse;min-width:880px;font-variant-numeric:tabular-nums}
.board-table th{background:#102944;color:#9edcff;text-align:left;padding:12px 11px;font-size:.83rem;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.board-table td{padding:12px 11px;border-bottom:1px solid #1d3851;color:#f3f7fc;font-size:.93rem;white-space:nowrap}
.board-table tbody tr:nth-child(even){background:#0a192a}
.board-table .flight-code{color:#ffd45b;font-weight:900;font-size:1.02rem}
.board-status{display:inline-block;border-radius:5px;padding:4px 8px;background:#183e55;color:#bceaff;font-weight:800;font-size:.82rem}
.board-status.ground{background:#34452a;color:#d8ff9e}.board-status.near{background:#4b3a18;color:#ffe18a}
.board-empty{padding:25px;text-align:center;color:#c4d5e6}
.board-note{padding:12px 15px;background:#0b1c2e;color:#b9cde0;font-size:.88rem;border-top:1px solid #294866}
.board-search{display:flex;gap:8px;flex-wrap:wrap;padding:12px 15px;background:#0a192a}
.board-search input{flex:1;min-width:200px}
@media(max-width:650px){.board-head{align-items:flex-start}.board-tabs a,.board-tabs button{flex:1}.board-clock{font-size:1.05rem}}

<script>
const airports=[
{country:'Maroc',city:'Casablanca',name:'Aéroport Mohammed V',iata:'CMN',icao:'GMMN'},
{country:'Algérie',city:'Alger',name:'Aéroport Houari-Boumédiène',iata:'ALG',icao:'DAAG'},
{country:'Tunisie',city:'Tunis',name:'Aéroport Tunis-Carthage',iata:'TUN',icao:'DTTA'},
{country:'Égypte',city:'Le Caire',name:'Aéroport international du Caire',iata:'CAI',icao:'HECA'},
{country:'Sénégal',city:'Dakar',name:'Aéroport Blaise-Diagne',iata:'DSS',icao:'GOBD'},
{country:"Côte d’Ivoire",city:'Abidjan',name:'Aéroport Félix-Houphouët-Boigny',iata:'ABJ',icao:'DIAP'},
{country:'Afrique du Sud',city:'Johannesbourg',name:'O. R. Tambo International',iata:'JNB',icao:'FAOR'},
{country:'France',city:'Paris',name:'Charles-de-Gaulle',iata:'CDG',icao:'LFPG'},
{country:'Espagne',city:'Madrid',name:'Adolfo-Suárez Madrid-Barajas',iata:'MAD',icao:'LEMD'},
{country:'Allemagne',city:'Francfort',name:'Frankfurt Airport',iata:'FRA',icao:'EDDF'},
{country:'Royaume-Uni',city:'Londres',name:'Heathrow Airport',iata:'LHR',icao:'EGLL'},
{country:'Italie',city:'Rome',name:'Leonardo da Vinci–Fiumicino',iata:'FCO',icao:'LIRF'},
{country:'Pays-Bas',city:'Amsterdam',name:'Amsterdam Schiphol',iata:'AMS',icao:'EHAM'},
{country:'États-Unis',city:'New York',name:'John F. Kennedy International',iata:'JFK',icao:'KJFK'},
{country:'Canada',city:'Toronto',name:'Toronto Pearson International',iata:'YYZ',icao:'CYYZ'},
{country:'Brésil',city:'São Paulo',name:'Guarulhos International',iata:'GRU',icao:'SBGR'},
{country:'Arabie saoudite',city:'Riyad',name:'King Khalid International',iata:'RUH',icao:'OERK'},
{country:'Émirats arabes unis',city:'Dubaï',name:'Dubai International',iata:'DXB',icao:'OMDB'},
{country:'Turquie',city:'Istanbul',name:'Istanbul Airport',iata:'IST',icao:'LTFM'},
{country:'Chine',city:'Pékin',name:'Beijing Capital International',iata:'PEK',icao:'ZBAA'}
];
const country=document.getElementById('countryFilter'),search=document.getElementById('airportSearch'),grid=document.getElementById('airportGrid'),empty=document.getElementById('emptyState');
[...new Set(airports.map(a=>a.country))].sort((a,b)=>a.localeCompare(b,'fr')).forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;country.appendChild(o);});
function render(){
 const q=search.value.trim().toLocaleLowerCase('fr'),c=country.value;
 const found=airports.filter(a=>(!c||a.country===c)&&(!q||[a.country,a.city,a.name,a.iata,a.icao].join(' ').toLocaleLowerCase('fr').includes(q)));
 grid.innerHTML=found.map(a=>'<article class="airport"><div class="codes">'+a.iata+' · '+a.icao+'</div><h3>'+a.city+' · '+a.country+'</h3><p>'+a.name+'</p><div class="actions"><a href="https://adsb.lol/live/airport/'+a.icao+'" target="_blank" rel="noopener noreferrer">📡 Avions détectés en direct</a></div></article>').join('');
 empty.style.display=found.length?'none':'block';
}
country.addEventListener('change',render);search.addEventListener('input',render);
document.getElementById('resetFilters').addEventListener('click',()=>{country.value='';search.value='';render();});
render();

/* Tableau des mouvements aériens : observations ADS-B réelles, sans horaires fabriqués */
const boardAirports=[
{country:'Maroc',city:'Casablanca',name:'Mohammed V',iata:'CMN',icao:'GMMN',lat:33.3675,lon:-7.58997},
{country:'Algérie',city:'Alger',name:'Houari-Boumédiène',iata:'ALG',icao:'DAAG',lat:36.691,lon:3.215},
{country:'Tunisie',city:'Tunis',name:'Tunis-Carthage',iata:'TUN',icao:'DTTA',lat:36.851,lon:10.227},
{country:'Égypte',city:'Le Caire',name:'Cairo International',iata:'CAI',icao:'HECA',lat:30.1219,lon:31.4056},
{country:'Sénégal',city:'Dakar',name:'Blaise-Diagne',iata:'DSS',icao:'GOBD',lat:14.67,lon:-17.073},
{country:'Côte d’Ivoire',city:'Abidjan',name:'Félix-Houphouët-Boigny',iata:'ABJ',icao:'DIAP',lat:5.261,lon:-3.926},
{country:'Afrique du Sud',city:'Johannesbourg',name:'O. R. Tambo',iata:'JNB',icao:'FAOR',lat:-26.139,lon:28.246},
{country:'France',city:'Paris',name:'Charles-de-Gaulle',iata:'CDG',icao:'LFPG',lat:49.0097,lon:2.5479},
{country:'Espagne',city:'Madrid',name:'Barajas',iata:'MAD',icao:'LEMD',lat:40.4983,lon:-3.5676},
{country:'Allemagne',city:'Francfort',name:'Frankfurt Airport',iata:'FRA',icao:'EDDF',lat:50.0379,lon:8.5622},
{country:'Royaume-Uni',city:'Londres',name:'Heathrow',iata:'LHR',icao:'EGLL',lat:51.47,lon:-0.4543},
{country:'Italie',city:'Rome',name:'Fiumicino',iata:'FCO',icao:'LIRF',lat:41.8003,lon:12.2389},
{country:'Pays-Bas',city:'Amsterdam',name:'Schiphol',iata:'AMS',icao:'EHAM',lat:52.3086,lon:4.7639},
{country:'États-Unis',city:'New York',name:'John F. Kennedy',iata:'JFK',icao:'KJFK',lat:40.6413,lon:-73.7781},
{country:'Canada',city:'Toronto',name:'Pearson',iata:'YYZ',icao:'CYYZ',lat:43.6777,lon:-79.6248},
{country:'Brésil',city:'São Paulo',name:'Guarulhos',iata:'GRU',icao:'SBGR',lat:-23.4356,lon:-46.4731},
{country:'Arabie saoudite',city:'Riyad',name:'King Khalid',iata:'RUH',icao:'OERK',lat:24.9576,lon:46.6988},
{country:'Émirats arabes unis',city:'Dubaï',name:'Dubai International',iata:'DXB',icao:'OMDB',lat:25.2532,lon:55.3657},
{country:'Turquie',city:'Istanbul',name:'Istanbul Airport',iata:'IST',icao:'LTFM',lat:41.2753,lon:28.7519},
{country:'Chine',city:'Pékin',name:'Beijing Capital',iata:'PEK',icao:'ZBAA',lat:40.0799,lon:116.6031}
];
const boardAirport=document.getElementById('boardAirport'),boardRows=document.getElementById('boardRows'),boardFilter=document.getElementById('boardFilter');
boardAirports.forEach((a,i)=>{const o=document.createElement('option');o.value=String(i);o.textContent=a.city+' · '+a.country+' ('+a.iata+')';boardAirport.appendChild(o);});
boardAirport.value='0';
const boardSafe=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const boardAlt=a=>{const v=a.alt_baro??a.alt_geom;return typeof v==='number'?Math.round(v).toLocaleString('fr-FR')+' ft':(v==='ground'?'Sol':(v??'—'));};
const boardSpeed=a=>a.gs!=null?Math.round(a.gs)+' kt':'—';
const boardMaker=t=>{const x=String(t||'').toUpperCase();if(/^A/.test(x))return 'Airbus · '+x;if(/^B/.test(x))return 'Boeing · '+x;if(/^E/.test(x))return 'Embraer · '+x;if(/^CRJ|^CL/.test(x))return 'Bombardier · '+x;if(/^ATR/.test(x))return 'ATR · '+x;if(/^DH|^DHC/.test(x))return 'De Havilland · '+x;return x||'Modèle non transmis';};
let boardAircraft=[];
function renderBoard(){
 const q=boardFilter.value.trim().toLocaleLowerCase('fr');
 const found=boardAircraft.filter(a=>[a.flight,a.r,a.t,a.type,a.hex].join(' ').toLocaleLowerCase('fr').includes(q));
 document.getElementById('boardCount').textContent=String(found.length);
 boardRows.innerHTML=found.slice(0,100).map(a=>{
  const alt=boardAlt(a),ground=a.alt_baro==='ground'||a.gs===0,near=typeof a.alt_baro==='number'&&a.alt_baro<=5000;
  const state=ground?'<span class="board-status ground">Au sol</span>':near?'<span class="board-status near">À proximité · altitude basse</span>':'<span class="board-status">En vol · signal reçu</span>';
  const callsign=String(a.flight||a.hex||'Sans indicatif').trim();
  return '<tr><td class="flight-code">'+boardSafe(callsign)+'</td><td>'+boardSafe((callsign.match(/^[A-Z]{2,3}/)||[])[0]||'Non identifiée')+'</td><td>'+boardSafe(a.r||'Non transmise')+'</td><td>'+boardSafe(boardMaker(a.t||a.type))+'</td><td>'+boardSafe(alt)+'</td><td>'+boardSafe(boardSpeed(a))+'</td><td>'+boardSafe(a.track!=null?Math.round(a.track)+'°':'—')+'</td><td>'+state+'</td></tr>';
 }).join('')||'<tr><td colspan="8" class="board-empty">Aucun appareil détecté dans les données reçues pour le moment.</td></tr>';
}
async function refreshBoard(){
 const a=boardAirports[Number(boardAirport.value)||0],status=document.getElementById('boardStatus'),btn=document.getElementById('boardRefresh');
 document.getElementById('boardAirportName').textContent=a.name+' · '+a.iata+' / '+a.icao;
 document.getElementById('officialDepartures').href='https://www.flightaware.com/live/airport/'+a.icao+'/departures';
 document.getElementById('officialArrivals').href='https://www.flightaware.com/live/airport/'+a.icao+'/arrivals';
 btn.disabled=true;status.textContent='Réception des signaux ADS-B autour de '+a.city+'…';
 boardRows.innerHTML='<tr><td colspan="8" class="board-empty">Actualisation des données…</td></tr>';
 try{
  const target='https://api.adsb.lol/v2/lat/'+a.lat+'/lon/'+a.lon+'/dist/80';
  const response=await fetch('https://proxy.cors.dev/'+target,{cache:'no-store',headers:{'Accept':'application/json'}});
  if(!response.ok)throw new Error('HTTP '+response.status);
  const payload=await response.json();
  boardAircraft=Array.isArray(payload.ac)?payload.ac:[];
  renderBoard();
  const now=new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  document.getElementById('boardUpdated').textContent=now;
  status.textContent=boardAircraft.length+' signal(aux) reçu(s) autour de '+a.city+'. Source : ADSB.lol. Actualisation automatique toutes les 60 secondes.';
 }catch(e){
  status.textContent='Flux ADS-B indisponible pour le moment ('+e.message+'). Les tableaux officiels de départs et arrivées restent accessibles avec les liens jaunes.';
  boardRows.innerHTML='<tr><td colspan="8" class="board-empty">Flux momentanément indisponible. Réessayez dans quelques instants.</td></tr>';
 }
 finally{btn.disabled=false;}
}
document.getElementById('boardRefresh').addEventListener('click',refreshBoard);
boardAirport.addEventListener('change',refreshBoard);
